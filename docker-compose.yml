services:
  codex:
    build:
      context: ./
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
        CODEX_VERSION: ${CODEX_VERSION}
        CODEX_TARGET: ${CODEX_TARGET}
    working_dir: /workspace
    command: ["sleep", "infinity"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp/
    volumes:
      - codex-home:/home/codex/.codex/
      - codex-cache:/home/codex/.cache/
      - ./config.toml:/home/codex/.codex/config.toml:ro
      - ./skills/:/home/codex/.codex/skills/:rw
      - ../:/workspace/:rw
    networks:
      - mcp
    restart: unless-stopped

networks:
  mcp:
    external: true
    name: mcp-share

volumes:
  codex-home:
  codex-cache:
